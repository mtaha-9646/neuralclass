name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint
        continue-on-error: true

      - name: Build application
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DOCKER_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        run: |
          # Install SSH key
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

          # Add VPS to known hosts
          ssh-keyscan -H $VPS_IP >> ~/.ssh/known_hosts 2>/dev/null

          # Deploy script
          ssh -i ~/.ssh/vps_key $VPS_USER@$VPS_IP << 'DEPLOY'
            set -e
            echo "Starting deployment..."

            # Stop old container
            docker stop neural-class-magazine || true
            docker rm neural-class-magazine || true

            # Pull latest image
            docker pull ${{ env.DOCKER_IMAGE }}

            # Run new container
            docker run -d \
              --name neural-class-magazine \
              -p 80:80 \
              -p 443:443 \
              --restart unless-stopped \
              -e VITE_ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }} \
              ${{ env.DOCKER_IMAGE }}

            echo "Deployment complete!"
            docker ps | grep neural-class-magazine
          DEPLOY

          # Cleanup
          rm ~/.ssh/vps_key

      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Deployment ${{ job.status }} - Neural Class Magazine'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
